{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-forail-operator
  labels:
    {{- include "forail-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["forail.forail-platform.io"]
    resources: ["jobtemplates", "inventories", "credentials", "schedules", "projects", "organizations", "teams", "workflows", "forailinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["forail.forail-platform.io"]
    resources: ["jobtemplates/status", "inventories/status", "credentials/status", "schedules/status", "projects/status", "organizations/status", "teams/status", "workflows/status", "forailinstances/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["forail.forail-platform.io"]
    resources: ["jobtemplates/finalizers", "inventories/finalizers", "credentials/finalizers", "schedules/finalizers", "projects/finalizers", "organizations/finalizers", "teams/finalizers", "workflows/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if .Values.leaderElection }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-forail-operator
  labels:
    {{- include "forail-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "forail-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-forail-operator
# needtofix M12: the credential reconciler reads referenced k8s Secrets for
# sensitive input fields (passwords, ssh keys, vault tokens). That access is a
# namespaced Role — NOT a cluster-wide secrets grant.
#
# A Credential resolves spec.inputsFrom in its OWN namespace, so every namespace
# holding Credential Secrets needs both a Role here and an entry in the
# manager's Secret cache (--secret-namespaces on the Deployment). A Role on its
# own is not enough: the cache would still reject the namespace with "unknown
# namespace for the cache". Both are rendered from .Values.secretNamespaces so
# they cannot drift apart.
{{- $secretNamespaces := concat (list .Release.Namespace) (.Values.secretNamespaces | default list) | uniq }}
{{- range $ns := $secretNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-forail-operator-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "forail-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-forail-operator-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "forail-operator.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "forail-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-forail-operator-secrets
{{- end }}
{{- end }}
