# Two-step pattern: first the Secret with sensitive fields, then the
# Credential CR that references it.
#
# A Credential resolves spec.inputsFrom in its OWN namespace, and the operator's
# Secret access is a namespaced Role, never a cluster-wide grant. Out of the box
# that means both objects live in the operator's namespace, as below.
#
# To keep them somewhere else, list that namespace at install time:
#
#   helm install forail-operator ... --set 'secretNamespaces={team-a,team-b}'
#
# which creates the Secret Role there and adds it to the operator's Secret
# cache. Without it, a Credential outside those namespaces fails with
#
#   read Secret team-a/deploy-ssh: unable to get: team-a/deploy-ssh
#     because of unknown namespace for the cache
apiVersion: v1
kind: Secret
metadata:
  name: deploy-ssh
  namespace: forail-operator
type: Opaque
stringData:
  # Replace the placeholder with a real OpenSSH private key BEFORE
  # applying — Forail validates the key on credential create and returns
  # HTTP 500 with `binascii.Error: Invalid base64-encoded string` if the
  # body is not a parseable key. Generate one with:
  #   ssh-keygen -t ed25519 -N '' -f ./deploy_key -C 'forail-deploy'
  # then paste the contents of ./deploy_key here.
  ssh_key_data: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    PLACEHOLDER-REPLACE-BEFORE-APPLY
    -----END OPENSSH PRIVATE KEY-----
---
apiVersion: forail.forail-platform.io/v1alpha1
kind: Credential
metadata:
  name: deploy-key
  namespace: forail-operator
spec:
  description: "SSH key used by deploy automation"
  organization: Default
  credentialType: Machine
  inputs:
    username: deploy
  inputsFrom:
    - name: ssh_key_data
      valueFrom:
        name: deploy-ssh
        key: ssh_key_data
